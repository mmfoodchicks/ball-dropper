name: verify

on:
  push:
  pull_request:

jobs:
  lint:
    name: GDScript parse + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: Parse every script
        run: |
          set -e
          find src tests -name '*.gd' -print0 | xargs -0 -n1 gdparse
      - run: gdlint src tests

  smoke:
    name: Headless smoke + full autoplay run
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Import resources
        run: godot --headless --path . --import || true
      - name: Logic smoke tests
        run: godot --headless --path . --script res://tests/smoke.gd
      - name: Full run via autoplay bot (must reach victory)
        run: timeout 420 godot --headless --path . -- --autoplay --god --turbo --quit-on-end
